# This workflow will build and test the auth-service on every push or pull request to the main branch.
#https://github.com/actions/setup-node.git lists every release with its commit hash

name: auth-service

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read # The job's token can only read the repository contents

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/auth
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: services/auth/package-lock.json
      - run: npm ci #not npm install, because this installs exactly what is in package-lock.json, which is what we want for CI.
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=moderate
