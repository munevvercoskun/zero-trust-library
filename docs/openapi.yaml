openapi: 3.0.3
info:
  title: zero-trust-library API
  version: 0.1.0
  license: { name: MIT, url: "https://opensource.org/licenses/MIT" }
  description: |
    The public API, served through the gateway. Every route traces back to docs/scope.md.

    Every route needs an access token unless it sets `security: []`.
    `x-roles` lists which roles may call a protected route.
    Request bodies reject any field that is not listed here.
servers:
  - url: /api

# Every route needs an access token unless it says otherwise.
# Public routes opt out with `security: []`.
security:
  - bearerAuth: []

tags:
  - name: auth
    description: Sign-in, sessions and password reset
  - name: account
    description: The signed-in user's own profile and security settings
  - name: catalogue
    description: Books and copies
  - name: loans
    description: Borrowing
  - name: holds
    description: Waiting list for books with no available copy
  - name: desk
    description: Librarian work at the front desk
  - name: admin
    description: User accounts and roles

paths:
  # ---------- auth ----------
  /auth/register:
    post:
      tags: [auth]
      summary: Register a member account
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, name, password]
              properties:
                email: { $ref: "#/components/schemas/Email" }
                name: { $ref: "#/components/schemas/Name" }
                password: { $ref: "#/components/schemas/Password" }
      responses:
        "202":
          description: Accepted. Same response whether or not the email is already registered.
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/login:
    post:
      tags: [auth]
      summary: Sign in with email and password
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { $ref: "#/components/schemas/Email" }
                password: { type: string, minLength: 1, maxLength: 128 }
      responses:
        "200":
          description: Signed in, or a 2FA code is needed next.
          headers:
            Set-Cookie:
              description: Refresh token (HttpOnly, Secure, SameSite=Strict). Only sent when no 2FA step is needed.
              schema: { type: string }
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AccessToken"
                  - $ref: "#/components/schemas/MfaChallenge"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/login/2fa:
    post:
      tags: [auth]
      summary: Finish signing in with a 2FA or backup code
      operationId: loginWith2fa
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [mfaToken, code]
              properties:
                mfaToken: { type: string, maxLength: 512 }
                code: { $ref: "#/components/schemas/MfaCode" }
      responses:
        "200":
          description: Signed in
          headers:
            Set-Cookie:
              description: Refresh token (HttpOnly, Secure, SameSite=Strict)
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessToken" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/refresh:
    post:
      tags: [auth]
      summary: Swap the refresh cookie for a new access token
      operationId: refreshSession
      description: Rotates the refresh token. Reusing an old one signs out the whole session.
      security:
        - refreshCookie: []
      responses:
        "200":
          description: New access token and refresh cookie
          headers:
            Set-Cookie:
              description: New refresh token
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessToken" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/logout:
    post:
      tags: [auth]
      summary: Sign out of this session
      operationId: logout
      security:
        - refreshCookie: []
      responses:
        "204":
          description: Signed out; refresh cookie cleared

  /auth/password-reset:
    post:
      tags: [auth]
      summary: Request a password reset email
      operationId: requestPasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { $ref: "#/components/schemas/Email" }
      responses:
        "202":
          description: Accepted. Same response whether or not the email exists.
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/password-reset/confirm:
    post:
      tags: [auth]
      summary: Set a new password with the token from the email
      operationId: confirmPasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, newPassword]
              properties:
                token: { type: string, minLength: 32, maxLength: 128 }
                newPassword: { $ref: "#/components/schemas/Password" }
      responses:
        "204":
          description: Password changed; all sessions signed out
        "400": { $ref: "#/components/responses/BadRequest" }

  # ---------- account ----------
  /me:
    get:
      tags: [account]
      summary: My profile
      operationId: getMyProfile
      x-roles: [member, librarian, admin]
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [account]
      summary: Edit my name or phone
      operationId: updateMyProfile
      x-roles: [member, librarian, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name: { $ref: "#/components/schemas/Name" }
                phone: { $ref: "#/components/schemas/Phone" }
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [account]
      summary: Delete my account
      operationId: deleteMyAccount
      description: Refused while I have an active loan.
      x-roles: [member, librarian]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password: { type: string, minLength: 1, maxLength: 128 }
      responses:
        "204":
          description: Account deleted
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }

  /me/export:
    get:
      tags: [account]
      summary: Download my data
      operationId: exportMyData
      x-roles: [member, librarian, admin]
      responses:
        "200":
          description: Profile, loans and holds as JSON
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataExport" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/password:
    post:
      tags: [account]
      summary: Change my password
      operationId: changeMyPassword
      x-roles: [member, librarian, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, minLength: 1, maxLength: 128 }
                newPassword: { $ref: "#/components/schemas/Password" }
      responses:
        "204":
          description: Changed; other sessions signed out
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/2fa:
    post:
      tags: [account]
      summary: Start 2FA setup
      operationId: start2faSetup
      description: 2FA stays off until a first code is confirmed.
      x-roles: [member, librarian, admin]
      responses:
        "200":
          description: Secret to add to an authenticator app
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [otpauthUrl]
                properties:
                  otpauthUrl: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [account]
      summary: Turn 2FA off
      operationId: disable2fa
      x-roles: [member, librarian, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password: { type: string, minLength: 1, maxLength: 128 }
      responses:
        "204":
          description: 2FA turned off
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/2fa/confirm:
    post:
      tags: [account]
      summary: Confirm 2FA with a first code
      operationId: confirm2fa
      x-roles: [member, librarian, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: { type: string, pattern: "^[0-9]{6}$" }
      responses:
        "200":
          description: 2FA on. Backup codes are shown this once only.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [backupCodes]
                properties:
                  backupCodes:
                    type: array
                    minItems: 10
                    maxItems: 10
                    items: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/sessions:
    get:
      tags: [account]
      summary: My active sessions
      operationId: listMySessions
      x-roles: [member, librarian, admin]
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [account]
      summary: Sign out everywhere
      operationId: signOutEverywhere
      x-roles: [member, librarian, admin]
      responses:
        "204":
          description: All sessions revoked
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/sessions/{sessionId}:
    delete:
      tags: [account]
      summary: Sign out one session
      operationId: signOutSession
      x-roles: [member, librarian, admin]
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "204":
          description: Session revoked
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /me/loans:
    get:
      tags: [loans]
      summary: My loans
      operationId: listMyLoans
      x-roles: [member, librarian]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [active, past], default: active }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Loans
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoanPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/holds:
    get:
      tags: [holds]
      summary: My open holds
      operationId: listMyHolds
      x-roles: [member, librarian]
      responses:
        "200":
          description: Holds
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Hold" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ---------- catalogue ----------
  /books:
    get:
      tags: [catalogue]
      summary: Search the catalogue
      operationId: searchBooks
      security: []
      parameters:
        - name: q
          in: query
          description: Words to match in title or author
          schema: { type: string, maxLength: 100 }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Matching books
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      tags: [catalogue]
      summary: Add a book
      operationId: addBook
      x-roles: [librarian]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Book" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /books/{bookId}:
    parameters:
      - $ref: "#/components/parameters/BookId"
    get:
      tags: [catalogue]
      summary: One book
      operationId: getBook
      security: []
      responses:
        "200":
          description: Book
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Book" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [catalogue]
      summary: Edit a book
      operationId: updateBook
      x-roles: [librarian]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookPatch" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Book" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [catalogue]
      summary: Remove a book
      operationId: removeBook
      description: Refused while any copy is on loan.
      x-roles: [librarian]
      responses:
        "204":
          description: Removed
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /books/{bookId}/cover:
    put:
      tags: [catalogue]
      summary: Upload or replace the cover image
      operationId: uploadCover
      description: JPEG or PNG, at most 2 MB. Checked from the file's bytes and re-encoded.
      x-roles: [librarian]
      parameters:
        - $ref: "#/components/parameters/BookId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [image]
              properties:
                image: { type: string, format: binary }
      responses:
        "200":
          description: Updated book
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Book" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /books/{bookId}/copies:
    get:
      tags: [catalogue]
      summary: List a book's copies
      operationId: listBookCopies
      x-roles: [librarian]
      parameters:
        - $ref: "#/components/parameters/BookId"
      responses:
        "200":
          description: Copies of the book
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Copy" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [catalogue]
      summary: Add a copy of a book
      operationId: addCopy
      x-roles: [librarian]
      parameters:
        - $ref: "#/components/parameters/BookId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [barcode]
              properties:
                barcode: { $ref: "#/components/schemas/Barcode" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Copy" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /copies/{copyId}:
    delete:
      tags: [catalogue]
      summary: Withdraw a copy
      operationId: withdrawCopy
      description: Marks it withdrawn; refused while it is on loan.
      x-roles: [librarian]
      parameters:
        - $ref: "#/components/parameters/CopyId"
      responses:
        "204":
          description: Withdrawn
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ---------- loans and holds ----------
  /loans:
    post:
      tags: [loans]
      summary: Borrow a book (self-checkout)
      operationId: borrowBook
      description: Assigns any available copy. Loan limit and overdue block apply.
      x-roles: [member, librarian]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [bookId]
              properties:
                bookId: { type: string, format: uuid }
      responses:
        "201":
          description: Borrowed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Loan" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    get:
      tags: [loans]
      summary: All active or overdue loans
      operationId: listAllLoans
      x-roles: [librarian]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [active, overdue], default: active }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Loans
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoanPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /holds:
    post:
      tags: [holds]
      summary: Place a hold on a book with no available copy
      operationId: placeHold
      x-roles: [member, librarian]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [bookId]
              properties:
                bookId: { type: string, format: uuid }
      responses:
        "201":
          description: Hold placed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Hold" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /holds/{holdId}:
    delete:
      tags: [holds]
      summary: Cancel my hold
      operationId: cancelHold
      x-roles: [member, librarian]
      parameters:
        - $ref: "#/components/parameters/HoldId"
      responses:
        "204":
          description: Cancelled
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------- desk ----------
  /desk/loans:
    post:
      tags: [desk]
      summary: Check out a copy for a member
      operationId: deskCheckout
      description: The member's loan limit and overdue block apply. The loan records the librarian as issuer.
      x-roles: [librarian]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [barcode, memberId]
              properties:
                barcode: { $ref: "#/components/schemas/Barcode" }
                memberId: { type: string, format: uuid }
      responses:
        "201":
          description: Borrowed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Loan" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /desk/returns:
    post:
      tags: [desk]
      summary: Record a returned copy
      operationId: deskReturn
      x-roles: [librarian]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [barcode]
              properties:
                barcode: { $ref: "#/components/schemas/Barcode" }
      responses:
        "200":
          description: Returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Loan" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------- admin ----------
  /users:
    get:
      tags: [admin]
      summary: Find user accounts
      operationId: listUsers
      x-roles: [admin]
      parameters:
        - name: q
          in: query
          description: Part of a name or email
          schema: { type: string, maxLength: 100 }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /users/{userId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [admin]
      summary: One user account
      operationId: getUser
      x-roles: [admin]
      responses:
        "200":
          description: User
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [admin]
      summary: Edit, re-role, disable or re-enable an account
      operationId: updateUser
      description: Roles can only be set to member or librarian. Admin accounts are not created through the API.
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name: { $ref: "#/components/schemas/Name" }
                email: { $ref: "#/components/schemas/Email" }
                role: { type: string, enum: [member, librarian] }
                isActive: { type: boolean }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT (Ed25519)
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token

  parameters:
    BookId:
      name: bookId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CopyId:
      name: copyId
      in: path
      required: true
      schema: { type: string, format: uuid }
    HoldId:
      name: holdId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }

  schemas:
    Email: { type: string, format: email, maxLength: 254 }
    Name: { type: string, minLength: 1, maxLength: 100 }
    Phone: { type: string, maxLength: 30, pattern: "^[0-9+() -]*$" }
    Password: { type: string, minLength: 12, maxLength: 128 }
    MfaCode:
      type: string
      description: 6-digit code from the authenticator app, or a backup code
      minLength: 6
      maxLength: 20
    Barcode: { type: string, minLength: 1, maxLength: 40, pattern: "^[A-Za-z0-9-]+$" }
    Role: { type: string, enum: [member, librarian, admin] }

    AccessToken:
      type: object
      additionalProperties: false
      required: [accessToken, expiresIn]
      properties:
        accessToken: { type: string }
        expiresIn: { type: integer, description: Seconds until expiry }
    MfaChallenge:
      type: object
      additionalProperties: false
      required: [mfaRequired, mfaToken]
      properties:
        mfaRequired: { type: boolean, enum: [true] }
        mfaToken: { type: string, description: "Valid for 5 minutes, only at /auth/login/2fa" }

    Profile:
      type: object
      additionalProperties: false
      required: [id, email, name, role, twoFactorEnabled]
      properties:
        id: { type: string, format: uuid }
        email: { $ref: "#/components/schemas/Email" }
        name: { $ref: "#/components/schemas/Name" }
        phone: { type: string, nullable: true }
        role: { $ref: "#/components/schemas/Role" }
        twoFactorEnabled: { type: boolean }
    AdminUser:
      type: object
      additionalProperties: false
      required: [id, email, name, role, isActive, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { $ref: "#/components/schemas/Email" }
        name: { $ref: "#/components/schemas/Name" }
        role: { $ref: "#/components/schemas/Role" }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
    Session:
      type: object
      additionalProperties: false
      required: [id, createdAt, lastUsedAt, current]
      properties:
        id: { type: string, format: uuid }
        userAgent: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
        current: { type: boolean, description: True for the session making this request }

    BookInput:
      type: object
      additionalProperties: false
      required: [title, author]
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
        author: { type: string, minLength: 1, maxLength: 200 }
        genre: { type: string, maxLength: 60 }
        publicationYear: { type: integer, minimum: 0, maximum: 2100 }
        isbn: { type: string, pattern: "^[0-9X-]{10,17}$" }
    BookPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
        author: { type: string, minLength: 1, maxLength: 200 }
        genre: { type: string, maxLength: 60 }
        publicationYear: { type: integer, minimum: 0, maximum: 2100 }
        isbn: { type: string, pattern: "^[0-9X-]{10,17}$" }
    Book:
      type: object
      additionalProperties: false
      required: [id, title, author, availableCopies, totalCopies]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        author: { type: string }
        genre: { type: string, nullable: true }
        publicationYear: { type: integer, nullable: true }
        isbn: { type: string, nullable: true }
        coverUrl: { type: string, nullable: true }
        availableCopies: { type: integer, minimum: 0 }
        totalCopies: { type: integer, minimum: 0 }
    Copy:
      type: object
      additionalProperties: false
      required: [id, bookId, barcode, status]
      properties:
        id: { type: string, format: uuid }
        bookId: { type: string, format: uuid }
        barcode: { $ref: "#/components/schemas/Barcode" }
        status: { type: string, enum: [available, on_loan, on_hold, withdrawn] }
    Loan:
      type: object
      additionalProperties: false
      required: [id, bookId, title, copyId, memberId, borrowedAt, dueAt]
      properties:
        id: { type: string, format: uuid }
        bookId: { type: string, format: uuid }
        title: { type: string }
        copyId: { type: string, format: uuid }
        memberId: { type: string, format: uuid }
        borrowedAt: { type: string, format: date-time }
        dueAt: { type: string, format: date-time }
        returnedAt: { type: string, format: date-time, nullable: true }
    Hold:
      type: object
      additionalProperties: false
      required: [id, bookId, title, placedAt, position]
      properties:
        id: { type: string, format: uuid }
        bookId: { type: string, format: uuid }
        title: { type: string }
        placedAt: { type: string, format: date-time }
        position: { type: integer, minimum: 1, description: Place in the queue }
        readyUntil: { type: string, format: date-time, nullable: true }
    DataExport:
      type: object
      additionalProperties: false
      required: [profile, loans, holds, exportedAt]
      properties:
        profile: { $ref: "#/components/schemas/Profile" }
        loans:
          type: array
          items: { $ref: "#/components/schemas/Loan" }
        holds:
          type: array
          items: { $ref: "#/components/schemas/Hold" }
        exportedAt: { type: string, format: date-time }

    PageInfo:
      type: object
      additionalProperties: false
      required: [page, pageSize, total]
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    BookPage:
      type: object
      additionalProperties: false
      required: [items, pageInfo]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Book" }
        pageInfo: { $ref: "#/components/schemas/PageInfo" }
    LoanPage:
      type: object
      additionalProperties: false
      required: [items, pageInfo]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Loan" }
        pageInfo: { $ref: "#/components/schemas/PageInfo" }
    UserPage:
      type: object
      additionalProperties: false
      required: [items, pageInfo]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminUser" }
        pageInfo: { $ref: "#/components/schemas/PageInfo" }

    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }

  responses:
    BadRequest:
      description: The request does not match this spec
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Not signed in, or the credentials are wrong
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Signed in, but this role may not do this
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such record, or not one this user may see
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Breaks a rule, e.g. loan limit reached or copy already on loan
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: Rate limit reached
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
