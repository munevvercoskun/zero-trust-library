# compose.yaml
# Local development only. Values come from .env.
services:
  # Backend Database Service
  auth-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${AUTH_DB_SUPERUSER_PASSWORD}
      POSTGRES_DB: ${AUTH_DB_NAME}
      AUTH_DB_OWNER_PASSWORD: ${AUTH_DB_OWNER_PASSWORD}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
    volumes:
      - auth-db-data:/var/lib/postgresql/data
      - ./infra/db/auth-init.sh:/docker-entrypoint-initdb.d/auth-init.sh:ro # Mounts local init scripts as read-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${AUTH_DB_NAME}"]
      interval: 10s       # How often to run the test
      timeout: 5s         # How long to wait for a response
      retries: 5          # Number of failures before marking unhealthy
      start_period: 10s   # Grace period to allow initial boot without failing
    ports:
      - "127.0.0.1:${AUTH_DB_PORT}:5432"  # Expose database port for local development. 127.0.0.1 part keeps it off my network
volumes:
     auth-db-data:
